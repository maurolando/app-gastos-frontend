<h2 mat-dialog-title>
  <mat-icon style="vertical-align: middle; margin-right: 8px; color: #6366f1;">lock_reset</mat-icon>
  Cambiar Contraseña
</h2>

<mat-dialog-content>
  <div class="persona-badge">
    <mat-icon>account_circle</mat-icon>
    <span>{{persona.nombre | uppercase}}</span>
  </div>

  <form [formGroup]="form" class="pass-form">
    <mat-form-field appearance="outline">
      <mat-label>Nueva contraseña</mat-label>
      <input matInput [type]="showNueva ? 'text' : 'password'" formControlName="nueva">
      <mat-icon matPrefix>lock</mat-icon>
      <button mat-icon-button matSuffix type="button" (click)="showNueva = !showNueva">
        <mat-icon>{{showNueva ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-hint *ngIf="form.get('nueva')?.errors?.['minlength']">
        Mínimo 3 caracteres
      </mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Confirmar contraseña</mat-label>
      <input matInput [type]="showConfirmar ? 'text' : 'password'" formControlName="confirmar">
      <mat-icon matPrefix>lock_outline</mat-icon>
      <button mat-icon-button matSuffix type="button" (click)="showConfirmar = !showConfirmar">
        <mat-icon>{{showConfirmar ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
    </mat-form-field>

    <div class="no-coinciden-error" *ngIf="form.errors?.['noCoinciden'] && form.get('confirmar')?.dirty">
      <mat-icon>error_outline</mat-icon>
      Las contraseñas no coinciden
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary"
          [disabled]="form.invalid || loading"
          (click)="guardar()">
    <mat-spinner diameter="18" *ngIf="loading"></mat-spinner>
    <mat-icon *ngIf="!loading">save</mat-icon>
    {{loading ? 'Guardando...' : 'Guardar'}}
  </button>
</mat-dialog-actions>
