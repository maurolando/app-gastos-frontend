<h2 mat-dialog-title>{{ isEdit ? 'Editar' : 'Registrar Nueva' }} Persona</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="persona-form">
    <p class="form-hint" *ngIf="!isEdit">Registra un nuevo integrante para el control de gastos.</p>
    
    <mat-form-field appearance="outline">
      <mat-label>Nombre Completo</mat-label>
      <mat-icon matPrefix>person</mat-icon>
      <input matInput formControlName="nombre" placeholder="Ej: Daiana Rivas">
      <mat-error *ngIf="form.get('nombre')?.hasError('required')">El nombre es obligatorio.</mat-error>
    </mat-form-field>

    <div class="checkbox-container" *ngIf="isEdit">
      <mat-checkbox formControlName="activo" color="primary">
        Persona Activa
      </mat-checkbox>
      <p class="hint">Si se desactiva, no aparecerá en las opciones para nuevos gastos.</p>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()">
    {{ isEdit ? 'Actualizar' : 'Crear Persona' }}
  </button>
</mat-dialog-actions>
