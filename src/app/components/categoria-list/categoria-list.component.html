<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Categorías</h1>
      <p class="page-subtitle">Cómo se agrupan los gastos y los ingresos</p>
    </div>
    <div class="page-actions">
      <button mat-flat-button color="accent" (click)="openForm()">
        <mat-icon>add</mat-icon> Nueva categoría
      </button>
    </div>
  </div>

  <div class="categories-grid">
    <mat-card *ngFor="let cat of (categorias$ | async)" class="cat-card mat-elevation-z3">
      <mat-card-header>
        <div class="cat-icon-container">
            <mat-icon mat-card-avatar class="cat-icon">{{cat.icono || 'category'}}</mat-icon>
        </div>
        <div class="cat-header-text">
            <mat-card-title>{{cat.nombre | uppercase}}</mat-card-title>
            <mat-card-subtitle>
              {{cat.tipo | uppercase}}<ng-container *ngIf="cat.tipo === 'GASTO'"> · {{ nombreGrupo(cat.grupo) }}</ng-container>
            </mat-card-subtitle>
        </div>
        <div class="cat-acciones">
          <button mat-icon-button (click)="editCat(cat)" matTooltip="Editar categoría" aria-label="Editar categoría">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteCat(cat.id)" matTooltip="Eliminar categoría" aria-label="Eliminar categoría">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>
      </mat-card-header>
    </mat-card>
  </div>
</div>
