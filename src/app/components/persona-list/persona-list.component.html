<div class="list-container mat-elevation-z3">
  <div class="list-header">
    <h2>Directorio de Personas</h2>
    <span class="spacer"></span>
    <button mat-flat-button color="accent" (click)="openAddPersona()">
      <mat-icon>person_add</mat-icon> Nueva Persona
    </button>
  </div>

  <table mat-table [dataSource]="(personas$ | async) || []" class="personas-table">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let element"> 
        <div class="user-avatar-row">
            <mat-icon color="primary">account_circle</mat-icon>
            <span class="username">{{element.nombre}}</span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="creadoEn">
      <th mat-header-cell *matHeaderCellDef> Fecha de Registro </th>
      <td mat-cell *matCellDef="let element"> {{element.creadoEn | date:'medium'}} </td>
    </ng-container>

    <ng-container matColumnDef="activo">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let element"> 
        <span class="status-badge" [class.active]="element.activo">
            {{element.activo ? 'Activo' : 'Inactivo'}}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let element">
        <div class="actions-cell">
          <button mat-icon-button color="primary" (click)="editPersona(element)" matTooltip="Editar Persona">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="viewSummary(element)" matTooltip="Ver Resumen de Gastos">
            <mat-icon>analytics</mat-icon>
          </button>
          <button mat-icon-button (click)="changePassword(element)" matTooltip="Cambiar Contraseña" class="password-btn">
            <mat-icon>lock_reset</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
