<h2 mat-dialog-title>{{ editando ? 'Editar Ingreso' : 'Registrar Ingreso' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="ingreso-form">
    <mat-form-field appearance="outline">
      <mat-label>Monto</mat-label>
      <span matPrefix>Gs &nbsp;</span>
      <input matInput appMiles inputmode="numeric" formControlName="monto">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Categoría</mat-label>
      <mat-select formControlName="categoriaId">
        <mat-option *ngFor="let cat of (categorias$ | async)" [value]="cat.id">
          <mat-icon *ngIf="cat.icono">{{cat.icono}}</mat-icon> {{cat.nombre | uppercase}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Asignado a</mat-label>
      <mat-select formControlName="personaId">
        <mat-option *ngFor="let p of (personas$ | async)" [value]="p.id">
          {{p.nombre | uppercase}}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>person</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fecha">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div>
      <mat-checkbox formControlName="recurrent" color="primary">
        Es un ingreso fijo
      </mat-checkbox>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()">Guardar</button>
</mat-dialog-actions>
