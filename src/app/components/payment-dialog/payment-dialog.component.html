<h2 mat-dialog-title>
  <mat-icon *ngIf="data.categoria?.icono" style="vertical-align: middle; margin-right: 8px;">{{data.categoria?.icono}}</mat-icon>
  Confirmar Pago: {{data.categoria?.nombre | uppercase}}
</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="payment-form">
    <mat-form-field appearance="outline">
      <mat-label>Monto a Pagar</mat-label>
      <span matPrefix>Gs &nbsp;</span>
      <input matInput type="number" formControlName="amount">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Quién Paga</mat-label>
      <mat-select formControlName="personaId">
        <mat-option *ngFor="let p of (personas$ | async)" [value]="p.id">
          {{p.nombre | uppercase}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Forma de Pago</mat-label>
      <mat-select formControlName="formaPago">
        <mat-option value="Efectivo">Efectivo</mat-option>
        <mat-option value="Tarjeta de Débito">Tarjeta de Débito</mat-option>
        <mat-option value="Tarjeta de Crédito">Tarjeta de Crédito</mat-option>
        <mat-option value="Transferencia">Transferencia</mat-option>
        <mat-option value="Convenio">Convenio</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha de Vencimiento</mat-label>
      <input matInput [value]="data.fechaVencimiento | date:'dd/MM/yyyy'" readonly>
      <mat-hint>Campo de lectura únicamente</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha de Pago</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fechaPago">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="onConfirm()">Confirmar Pago</button>
</mat-dialog-actions>
